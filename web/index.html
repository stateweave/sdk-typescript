<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StateWeave Chat Lab</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">Development</p>
          <h1>StateWeave Chat Lab</h1>
        </div>
        <div class="topbar-actions">
          <span id="provider" class="badge">Checking provider…</span>
          <button id="reset" class="button secondary" type="button">Reset</button>
        </div>
      </header>

      <main class="shell">
        <section class="card chat-card" aria-label="Chat">
          <div id="chat" class="chat">
            <div class="empty-state">
              <h2>Ask anything.</h2>
              <p>Each turn compares regular chat messages with StateWeave GraphFrame state.</p>
            </div>
          </div>

          <form id="composer" class="composer">
            <textarea id="input" rows="3" placeholder="Type a message…"></textarea>
            <button id="send" class="button primary" type="submit">Send</button>
          </form>
          <p id="status" class="status">Ready.</p>
        </section>

        <section class="card compare-card" aria-label="Comparison">
          <div class="card-header">
            <div>
              <p class="eyebrow">Latest turn</p>
              <h2>Model IO comparison</h2>
            </div>
          </div>

          <div class="comparison">
            <article class="compare-column">
              <div class="column-header">
                <span class="dot regular"></span>
                <h3>Regular messages</h3>
              </div>
              <label>Model input</label>
              <pre id="regular-input" class="code">No turn yet.</pre>
              <label>Model output</label>
              <pre id="regular-output" class="code small">No output yet.</pre>
            </article>

            <article class="compare-column">
              <div class="column-header">
                <span class="dot stateweave"></span>
                <h3>StateWeave GraphFrame</h3>
              </div>
              <label>Model input</label>
              <pre id="state-input" class="code">No turn yet.</pre>
              <label>Model output</label>
              <pre id="state-output" class="code small">No output yet.</pre>
            </article>
          </div>

          <div class="graph-card">
            <label>StateGraph after StateWeave</label>
            <div id="graph" class="graph-empty">No graph yet.</div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
