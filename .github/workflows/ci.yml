name: CI

on:
  push:
    branches: [main, uat, development]
  pull_request:
    branches: [main, uat, development]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify offline evaluation logic
        run: python3 -m unittest discover -s evaluations/native-recall-v1 -p 'test_[cjs]*.py' -v
      - run: pnpm build
      - run: node evaluations/native-recall-v1/test-import.mjs
