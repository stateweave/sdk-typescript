services:
  stateweave-web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        STATEWEAVE_WEB_BASE_PATH: ${STATEWEAVE_WEB_BASE_PATH:-/lab/}
    environment:
      NODE_ENV: production
      PORT: 3000
      STATEWEAVE_WEB_BASE_PATH: ${STATEWEAVE_WEB_BASE_PATH:-/lab/}
      STATEWEAVE_MODEL_PROVIDER: ${STATEWEAVE_MODEL_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      ANTHROPIC_VERSION: ${ANTHROPIC_VERSION:-2023-06-01}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-latest}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-1024}
      ANTHROPIC_TEMPERATURE: ${ANTHROPIC_TEMPERATURE:-0}
      STATEWEAVE_RUN_STORE: ${STATEWEAVE_RUN_STORE:-/data/eval-runs.json}
      STATEWEAVE_TRACE_DIR: ${STATEWEAVE_TRACE_DIR:-/data/traces}
    volumes:
      - stateweave-web-data:/data
    ports:
      - "3000"

volumes:
  stateweave-web-data:
